[project]
name = "property-insights-assistant"
version = "0.1.0"
description = "An agent that answers questions about a portfolio of short-stay property listings and their bookings, backed by SQL, RAG, and a cancellation-risk model."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "joblib>=1.3",
    "groq>=0.11",
    "python-dotenv>=1.0",
    "openai>=2.48.0",
    "azure-search-documents>=12.0.0",
    "fastapi>=0.140.0",
    "uvicorn>=0.51.0",
    "requests>=2.31",
    "mlflow<=2.16.2",
    "azure-monitor-opentelemetry>=1.8.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "ml"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# prompt template strings are natural-language prose, not code — wrapping
# them to fit a code line-length limit hurts readability for no benefit
"agent/llm.py" = ["E501"]
# sys.path must be patched before the ml.model import can resolve — see the
# comment in the file for why (Azure ML's inference server only puts this
# script's own directory on sys.path, not the uploaded code root)
"ml/azure/score.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
